report_comment: >

  This report has been generated by the <a href="https://github.com/prc992/SNAP/releases/tag/v1.0.15" target="_blank">SNAP:</a>
  Streamlined Nextflow Analysis Pipeline for profiling circulating histone modifications identifies tumor epigenomic signatures in cancer plasma.
  
export_plots: false
disable_version_detection: true

module_order:
  - general_stats:
      name: "General Stats"
      info: "This section of the report shows general statistics about the samples."
  - custom_content:
  - deeptools:
      name: "Fragment Size Distribution"
  - preseq:
      name: "Library Complexity"
  - fastqc:
      name: "FastQC (raw)"
      info: "This section of the report shows FastQC results before adapter trimming."
  - picard:
      name: "Picard duplication stats"
  - samtools:
      name: "Samtools alignment scores (before filtering)"
      path_filters:
        - "*notFiltered.stats"
        - "*notFiltered.idxstats"
        - "*notFiltered.flagstat"
  - samtools:
      name: "Samtools alignment scores (after filtering)"
      path_filters:
        - "*AfterFilter.stats"
        - "*AfterFilter.idxstats"
        - "*AfterFilter.flagstat"
  - cutadapt:
      name: "Adapter Trimming"
      info: "This section of the report shows adapter trimming results."

custom_content:
  order:
    - alignment_statistics
    - frags_plot
    - peaks_plot
    - igv_housekeeping_genes
    - merged_enrichment_MEDIP
    - merged_enrichment_H3K4ME3
    - merged_enrichment_H3K27AC
    - merged_signal_medip
    - merged_signal_h3k4me3
    - merged_signal_h3k27ac
    - fragment_lengths
    - ct_fragle_plot
    - dendogram_of_samples_by_snp_profile
    - genomic_annotation

custom_data:
  alignment_statistics:
    section_name: "Alignment Statistics"
    description: "Read counts before and after trimming, after alignment filtering (MAPQ>30), and after duplicate removal and DAC exclusion."
    plot_type: "table"
    file_format: "tsv"
    headers:
      Total reads:
        description: "Reads before fastp filtering."
        format: "{:,.0f}"
      Filtered reads:
        description: "Reads retained after fastp filtering and supplied to alignment."
        format: "{:,.0f}"
      Mapped Reads:
        description: "Alignment records retained after the MAPQ and SAM-flag filter."
        format: "{:,.0f}"
      Deduplicated reads:
        description: "Alignment records retained after duplicate removal and optional DAC-region exclusion."
        format: "{:,.0f}"

  dendogram_of_samples_by_snp_profile:
    section_name: "Dendrogram of Samples by SNP Profile"
    description: "Dendrogram of Samples by SNP Profile"
    order: 1000

  genomic_annotation:
    section_name: "Genomic Annotation"
    plot_type: 'html'
    data: |
      <b>Genomic Distribution Across Samples</b><br>
      <img src="z1_forced_genomic_distribution_barplot.jpg" width="1000"><br><br>
    
      <b>Distribution of peaks relative to TSS</b><br>
      <img src="z2_combined_TSS_distribution.jpg" width="1000"><br><br>

    order: 1010

sp:
  alignment_statistics:
    fn: "alignment_statistics_mqc.tsv"
  dendogram_of_samples_by_snp_profile:
    fn: "Dendrogram_of_Samples_by_SNP_Profile.jpg"


ignore_images: false

table_columns_visible:
    macs2-treatment_redundant_rate: False
    samtools_alignment_scores_after_filtering_flagstat-mapped_passed : False
    samtools_alignment_scores_after_filtering_stats-raw_total_sequences: False
    samtools_alignment_scores_after_filtering_stats-reads_properly_paired_percent: False
    samtools_alignment_scores_after_filtering_stats-reads_mapped_percent: False
    samtools_alignment_scores_after_filtering_stats-reads_mapped: False
    samtools_alignment_scores_after_filtering_stats-non_primary_alignments: False
    samtools_alignment_scores_before_filtering_stats-non_primary_alignments: False
    samtools_alignment_scores_before_filtering_flagstat-mapped_passed: False
    samtools_alignment_scores_before_filtering_stats-raw_total_sequences: False


        
remove_sections:
    - "samtools-idxstats-xy-counts"
    - "samtools-flagstat"
    - "samtools-idxstats"
    - "samtools-stats"
    - "cutadapt_filtered_reads"
    - "cutadapt_trimmed_sequences_3"
    - "fastqc_top_overrepresented_sequences"
    - "fastqc_per_base_sequence_content"

extra_fn_clean_trim:
  - "_1"
  - "_2"
  - "_1_val_1"
  - "_2_val_2"
  - ".unique"
  - ".LibComplexity.metrics"
  - ".notFiltered"
  - ".notFiltered.stats"
  - ".notFiltered.idxstats"
  - ".notFiltered.flagstat"
  - ".filtered"
  - ".AfterFilter"
  - ".AfterFilter.stats"
  - ".AfterFilter.idxstats"
  - ".AfterFilter.flagstat"
  - ".lc_extrap"
